spring.application.name=orderhub-app
server.port=8080
server.address=0.0.0.0

# MongoDB Configuration (Menu data)
spring.data.mongodb.uri=mongodb://localhost:27017/orderhub

# MySQL Configuration (Users, Orders, Core entities)
spring.datasource.url=jdbc:mysql://localhost:3306/orderhub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Properties (custom, used in JwtUtil)
jwt.secret=aVeryLongSecretKeyThatNeedsToBeAtLeast256BitsLongForHMACSHA256
jwt.expiration=86400000

# Logging Configuration
logging.level.com.orderhub.app=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
